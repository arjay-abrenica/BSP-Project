<div class="bsp-page-container profile-page">
    
    <!-- Top Green Banner -->
    <div class="profile-header-banner">
        <h2 class="banner-title">Account Settings</h2>
    </div>

    <!-- Main Card Body -->
    <div class="profile-card">
        
        <!-- Overlapping Avatar -->
        <div class="avatar-container">
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="#1a7a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <div class="user-details">
            <h2>{{ userName | titlecase }}</h2>
            <p>{{ userEmail }}</p>
            <p class="user-role">Role: {{ userRole | titlecase }}</p>
            <p class="user-office">Office: {{ userOffice }}</p>
            <p class="user-status">Status: {{ userStatus | titlecase }}</p>
        </div>

        <div class="password-section">
            <h3 class="section-title">Change Password</h3>

            <div class="form-group">
                <label>Old Password <span class="required">Required</span></label>
                <input type="password" [(ngModel)]="oldPassword" class="bsp-input">
            </div>

            <div class="form-group">
                <label>New Password <span class="required">Required</span></label>
                <input type="password" [(ngModel)]="newPassword" class="bsp-input">
            </div>

            <button class="btn-solid-green save-btn" (click)="savePassword()">Save</button>
        </div>

    </div>
</div>
