<div class="bsp-page-container profile-page">
    
    <!-- Toast Notification Banner -->
    <div class="toast-notification-banner" [ngClass]="toastType" *ngIf="showToast" (click)="showToast = false">
        <div class="toast-banner-content">
            <!-- Success Icon -->
            <svg *ngIf="toastType === 'success'" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <!-- Error Icon -->
            <svg *ngIf="toastType === 'error'" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <!-- Warning Icon -->
            <svg *ngIf="toastType === 'warning'" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span class="toast-message-text">{{ toastMessage }}</span>
        </div>
    </div>
    
    <!-- Top Green Banner -->
    <div class="profile-header-banner">
        <h2 class="banner-title">Account Settings</h2>
    </div>

    <!-- Main Card Body -->
    <div class="profile-card">
        
        <!-- Overlapping Avatar -->
        <div class="avatar-container">
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="#1a7a3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <div class="user-details">
            <h2>{{ userName | titlecase }}</h2>
            <p>{{ userEmail }}</p>
            <p class="user-role">Role: {{ userRole | titlecase }}</p>
            <p class="user-office">Office: {{ userOffice }}</p>
            <p class="user-status">Status: {{ userStatus | titlecase }}</p>
        </div>

        <div class="password-section">
            <h3 class="section-title">Change Password</h3>

            <div class="form-group">
                <label>Old Password <span class="required">Required</span></label>
                <input type="password" [(ngModel)]="oldPassword" class="bsp-input">
            </div>

            <div class="form-group">
                <label>New Password <span class="required">Required</span></label>
                <input type="password" [(ngModel)]="newPassword" class="bsp-input">
            </div>

            <button class="btn-solid-green save-btn" (click)="savePassword()">Save</button>
        </div>

    </div>
</div>
