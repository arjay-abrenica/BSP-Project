<div class="content-header">
    <div class="header-titles">
        <h2>Property Overview</h2>
        <p>Manage and track fixed assets and properties.</p>
    </div>
    <div class="header-actions">
        <button class="btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Property
        </button>
    </div>
</div>

<div class="card property-table-card">
    <div class="card-header border-bottom">
        <h3>Property Masterlist</h3>
        
        <div class="table-actions">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Search properties...">
            </div>
            <button class="btn-outline">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                Filter
            </button>
        </div>
    </div>
    
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="bsp-table">
                <thead>
                    <tr>
                        <th>Property ID</th>
                        <th>Property Name</th>
                        <th>Category</th>
                        <th>Assigned To</th>
                        <th>Status</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let prop of mockProperties">
                        <td><strong>{{ prop.id }}</strong></td>
                        <td>{{ prop.name }}</td>
                        <td>{{ prop.category }}</td>
                        <td>{{ prop.assignedTo }}</td>
                        <td>
                            <span class="status-badge" [class.success]="prop.status === 'Active'" [class.warning]="prop.status === 'Maintenance'">
                                {{ prop.status }}
                            </span>
                        </td>
                        <td class="text-right">
                            <button class="btn-icon" title="Edit">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
