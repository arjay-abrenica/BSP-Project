<div class="bsp-page-container">
    <div class="page-title-bar">
        <h2><strong>Property</strong> <span class="divider">|</span> <span class="sub-page">Property Overview</span></h2>
    </div>

    <!-- Search & Action Bar -->
    <div class="action-top-bar">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#2c7a4b" stroke-width="3"><circle cx="10.5" cy="10.5" r="7.5"></circle><line x1="21" y1="21" x2="15.8" y2="15.8"></line></svg>
            <input type="text" placeholder="Search properties...">
        </div>
        
        <button class="btn-outline-green" style="margin-right: 1rem;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            Filter
        </button>

        <button class="btn-solid-green">
            <span class="plus-icon">+</span> Add Property
        </button>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table class="property-table">
            <thead>
                <tr>
                    <th>Property ID <svg class="sort-icon" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z" fill="currentColor"/></svg></th>
                    <th>Property Name <svg class="sort-icon" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z" fill="currentColor"/></svg></th>
                    <th>Category <svg class="sort-icon" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z" fill="currentColor"/></svg></th>
                    <th>Assigned To <svg class="sort-icon" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z" fill="currentColor"/></svg></th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let prop of mockProperties">
                    <td><strong>{{ prop.id }}</strong></td>
                    <td>{{ prop.name }}</td>
                    <td>{{ prop.category }}</td>
                    <td>{{ prop.assignedTo }}</td>
                    <td>
                        <span class="status-badge" [class.active]="prop.status === 'Active'" [class.warning]="prop.status === 'Maintenance'">
                            {{ prop.status }}
                        </span>
                    </td>
                    <td class="action-cell">
                        <button class="btn-icon" title="Edit">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
